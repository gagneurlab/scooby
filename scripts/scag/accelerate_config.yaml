# accelerate launch config for Scooby-2 (scAG) training: 4 GPUs on one node,
# bf16, as used for the published runs. The step counts in
# scooby/scag/configs/*.yaml (warmup_steps in particular) assume 4 processes.
compute_environment: LOCAL_MACHINE
deepspeed_config: {}
distributed_type: MULTI_GPU
downcast_bf16: 'yes'
fsdp_config: {}
gpu_ids: all
machine_rank: 0
main_training_function: main
megatron_lm_config: {}
mixed_precision: 'bf16'
num_machines: 1
num_processes: 4
rdzv_backend: static
same_network: true
use_cpu: false
