# As neurips.yaml, but starting from the AlphaGenome all-folds (distilled)
# weights. AlphaGenome was pretrained on every fold, so use this model for
# prediction and eQTL scoring, not as a held-out benchmark. Replace the
# /path/to/ placeholders, then launch from the repository root:
#   accelerate launch --config_file scripts/scag/accelerate_config.yaml \
#       -m scooby.scag.train --config scooby/scag/configs/neurips_all_folds.yaml

output_dir: /path/to/checkpoints
run_name: scag_neurips_all_folds

data:
  fasta_file: /path/to/scooby_training_data/genome_human.fa
  bed_file: /path/to/scooby_training_data/sequences.bed
  adata_rna_plus: /path/to/scooby_training_data/snapatac_merged_plus.h5ad
  adata_rna_minus: /path/to/scooby_training_data/snapatac_merged_minus.h5ad
  adata_atac: /path/to/scooby_training_data/snapatac_merged_atac.h5ad
  embedding: /path/to/scooby_training_data/embedding_no_val_genes_new.pq
  neighbors: /path/to/scooby_training_data/no_neighbors.npz
  adata_rna_key: fragment_single
  adata_atac_key: insertion
  test_fold: 3
  val_fold: 4
  context_length: 524288
  shift_augs: [-3, 3]
  rc_aug: true
  clip_soft: 5.0
  cell_sample_size: 64
  normalize_atac: true

model:
  cell_emb_dim: 14
  num_tracks: 3
  pretrained_model: /path/to/alphagenome-pytorch/model_all_folds.safetensors
  organism_index: 0
  target_bins: 6144
  early_exit_32bp: true
  freeze_batchnorm: true
  use_lora: true
  standardized_conv_lora: true
  lora:
    encoder_convs: true
    decoder_convs: false
    attn: true
    mlp: true
  lora_r: 8
  lora_alpha: 8
  head_input_norm: false

training:
  batch_size: 1
  lr: 4.0e-5
  cellstate_lr: 1.0e-4
  encoder_lora_lr: null
  wd: 1.0e-6
  clip_global_norm: 1.0
  steps_per_epoch: 41699
  num_epochs: 20
  warmup_steps: 2000
  num_workers: 8
  compile: true
  compile_mode: default
  ddp_static_graph: true
  eval_every_n: 256
  save_every_n: 2000
  total_weight: 0.2
  collapse_patience: 50
