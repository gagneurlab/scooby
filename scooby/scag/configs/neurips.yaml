# Scooby-2 (scAG) on the NeurIPS 2021 bone marrow multiome, with the same
# folds and cell-state embedding as the Borzoi-based scooby. Replace the
# /path/to/ placeholders, then launch from the repository root:
#   accelerate launch --config_file scripts/scag/accelerate_config.yaml \
#       -m scooby.scag.train --config scooby/scag/configs/neurips.yaml

output_dir: /path/to/checkpoints
run_name: scag_neurips

data:
  fasta_file: /path/to/scooby_training_data/genome_human.fa
  bed_file: /path/to/scooby_training_data/sequences.bed
  adata_rna_plus: /path/to/scooby_training_data/snapatac_merged_plus.h5ad
  adata_rna_minus: /path/to/scooby_training_data/snapatac_merged_minus.h5ad
  adata_atac: /path/to/scooby_training_data/snapatac_merged_atac.h5ad
  embedding: /path/to/scooby_training_data/embedding_no_val_genes_new.pq
  neighbors: /path/to/scooby_training_data/no_neighbors.npz  # single-cell targets
  adata_rna_key: fragment_single
  adata_atac_key: insertion
  test_fold: 3
  val_fold: 4
  context_length: 524288
  shift_augs: [-3, 3]
  rc_aug: true
  clip_soft: 5.0
  cell_sample_size: 64
  normalize_atac: true

model:
  cell_emb_dim: 14          # Poisson-MultiVI embedding
  num_tracks: 3             # RNA plus, RNA minus, ATAC
  pretrained_model: /path/to/alphagenome-pytorch/model_fold_1.safetensors
  organism_index: 0
  target_bins: 6144
  early_exit_32bp: true
  freeze_batchnorm: true
  use_lora: true
  standardized_conv_lora: true
  lora:
    encoder_convs: true
    decoder_convs: false
    attn: true
    mlp: true
  lora_r: 8
  lora_alpha: 8
  head_input_norm: false

training:
  batch_size: 1             # per GPU; 4 GPUs give an effective batch of 4
  lr: 4.0e-5
  cellstate_lr: 1.0e-4
  encoder_lora_lr: null     # defaults to lr
  wd: 1.0e-6
  clip_global_norm: 1.0
  steps_per_epoch: 41699    # training sequences per epoch
  num_epochs: 20
  warmup_steps: 2000        # optimizer steps
  num_workers: 8
  compile: true
  compile_mode: default
  ddp_static_graph: true
  eval_every_n: 256
  save_every_n: 2000
  total_weight: 0.2
  collapse_patience: 50
